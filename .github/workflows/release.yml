name: Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.11.x requires Python >=3.14.2.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run backend tests
        run: pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      # The browser is ~380MB and dominates a cold run, so cache it on the
      # resolved Playwright version rather than re-downloading every PR.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --prefix frontend playwright install --with-deps chromium
      # The system deps are outside the cached directory, so they are still
      # needed on a cache hit.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --prefix frontend playwright install-deps chromium
      # `globalSetup` builds the bundle before the suite runs.
      - run: npm --prefix frontend test

  release:
    # Gate the release on a green test run, and only release from main: on a
    # push, or a manual run to recover a release that failed (never on PRs).
    needs: [backend-tests, frontend-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: npm install
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
