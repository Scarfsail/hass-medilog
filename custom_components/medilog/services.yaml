add_or_update_record:
  fields:
    person_id:
      example: "person.john_doe"
      required: true
      selector:
        entity:
          domain: person
    id:
      example: "09402d80bba64cefb074315f4dc605e5"
      required: false
      selector:
        text:

    datetime:
      example: "2025-02-25T14:30:00"
      required: true
      selector:
        datetime:

    temperature:
      example: 37.5
      required: false
      selector:
        number:
          min: 35
          max: 42
          step: 0.1
          unit_of_measurement: "°C"

    medication_id:
      example: "a1b2c3d4e5f6"
      required: false
      selector:
        text:

    medication_amount:
      example: 2.5
      required: false
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1

    note:
      example: "Fever reduced after medication"
      required: false
      selector:
        text:
          multiline: true

delete_record:
  fields:
    person_id:
      example: "person.john_doe"
      required: true
      selector:
        entity:
          domain: person

    id:
      example: "09402d80bba64cefb074315f4dc605e5"
      required: true
      selector:
        text:

get_records:
  fields:
    person_id:
      example: "person.john_doe"
      required: true
      selector:
        entity:
          domain: person

get_person_list:
  fields: {}

# Medication Management Services
add_or_update_medication:
  fields:
    id:
      example: "a1b2c3d4e5f6"
      required: false
      selector:
        text:

    name:
      example: "Tantum Verde"
      required: true
      selector:
        text:

    units:
      example: "tablets"
      required: false
      selector:
        text:

    is_antipyretic:
      example: false
      required: false
      default: false
      selector:
        boolean:

    active_ingredient:
      example: "benzydamine hydrochloride"
      required: false
      selector:
        text:

delete_medication:
  fields:
    id:
      example: "a1b2c3d4e5f6"
      required: true
      selector:
        text:

get_medications:
  fields: {}

get_medication:
  fields:
    id:
      example: "a1b2c3d4e5f6"
      required: true
      selector:
        text:
